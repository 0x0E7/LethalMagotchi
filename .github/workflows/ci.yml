# LethalMagotchi — CI (see .claude/devops.md §3)
#
# Every PR and every push to the default branch: install, typecheck, lint, test,
# build all workspaces, then validate that the production image actually builds.
# Single job, fails fast, no retries. The image is built but NOT pushed here;
# publishing is deploy.yml's job.
#
# Not yet wired (nothing to build): release.yml / LAN-host SEA packaging from
# devops.md §3, because apps/lan-host and packages/game-core don't exist yet.

name: CI

on:
  pull_request:
  push:
    branches: [master, main]

# One in-flight run per branch; superseded runs are cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: typecheck / lint / test / build / e2e / image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Integration tests run against a real Postgres via buildApp() + app.inject().
    # Matches docker-compose.dev.yml so the DSN is identical locally and in CI;
    # the suite creates/migrates its own `lethalmagotchi_test` database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lethal
          POSTGRES_PASSWORD: lethal
          POSTGRES_DB: lethalmagotchi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lethal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Node 22 is a hard requirement, not a preference: apps/server uses
      # process.loadEnvFile() and top-level await.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Root script builds packages/shared first (both apps import its dist/),
      # then typechecks every workspace.
      - name: Typecheck
        run: npm run typecheck

      # No linter is configured yet. --if-present keeps this a no-op until one
      # is added at the repo root; it will start enforcing automatically then.
      - name: Lint
        run: npm run lint --if-present

      # Vitest: unit (packages/shared rules, rate-limiter math, client draft
      # storage) then integration (Fastify + real Postgres via app.inject()).
      # Playwright e2e runs separately below, after the client bundle exists.
      - name: Test
        run: npm test --if-present
        env:
          TEST_DATABASE_URL: postgresql://lethal:lethal@localhost:5432/lethalmagotchi_test

      # shared -> server -> client, in that order.
      - name: Build workspaces
        run: npm run build

      # E2E drives the built SPA served by the real server from one origin — the
      # same shape the production container runs.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test
        env:
          TEST_DATABASE_URL: postgresql://lethal:lethal@localhost:5432/lethalmagotchi_test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: docker/setup-buildx-action@v3

      # Validated, not pushed. Catches Dockerfile/lockfile drift on the PR that
      # causes it instead of at deploy time.
      - name: Build server image (validate only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: lethalmagotchi-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
